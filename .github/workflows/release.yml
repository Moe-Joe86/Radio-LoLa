# Checks the robot app and the Android app on every push. On main it also creates a GitHub release with the APK,
# the robot app package and the install script; the "releases/latest/download/…" links always point to the newest.
name: Build and release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  robot-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint and test (no hardware, with stand-ins)
        run: |
          uv sync
          uv run ruff check .
          uv run pytest -q
      - name: Build the robot app package
        run: uv build --wheel robot_app --out-dir dist
      - name: Check the package (entry point for the daemon, settings file included)
        run: |
          uv venv /tmp/probe
          uv pip install --python /tmp/probe --no-deps dist/radio_lola-1.0.0-py3-none-any.whl
          /tmp/probe/bin/python -c "
          from importlib.metadata import entry_points
          from importlib.resources import files
          assert entry_points(group='reachy_mini_apps')['radio_lola'].value == 'radio_lola.main:RadioLola'
          assert (files('radio_lola') / 'settings.toml').is_file()
          print('package fine')"
          bash -n robot_app/install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: robot-app
          path: |
            dist/radio_lola-1.0.0-py3-none-any.whl
            robot_app/install.sh

  android-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build the APK
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Radio-LoLa.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: android/Radio-LoLa.apk

  release:
    if: github.ref == 'refs/heads/main'
    needs: [robot-app, android-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: output
          merge-multiple: true
      - name: Collect the files
        run: find output -type f -exec cp {} . \; && ls -la *.apk *.whl *.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Radio LoLa (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          body: |
            Built automatically from ${{ github.sha }}.
            - Radio-LoLa.apk: the Android app
            - radio_lola-1.0.0-py3-none-any.whl and install.sh: the radio for the robot (see the README)
          files: |
            Radio-LoLa.apk
            radio_lola-1.0.0-py3-none-any.whl
            install.sh
